name: Ejecucion Diaria de Script

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (Equivale a las 09:00 o 10:00 en España según el cambio de hora)
    - cron: '0 6 * * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde GitHub si quieres probarlo antes

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Puedes cambiarlo por la versión que uses

    - name: Instalar librerias necesarias
      run: |
        python -m pip install --upgrade pip
        # Aquí abajo escribe las librerías que usaba tu Colab (ejemplo: pandas, requests)
        # Si no usabas librerías externas, puedes borrar las líneas de abajo
        pip install pandas requests

    - name: Ejecutar el script de Python
      run: python script.py
