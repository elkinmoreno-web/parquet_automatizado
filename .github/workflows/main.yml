name: Pipeline Producción (riders)

on:
  schedule:
    - cron: '13 */8 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configurar archivo de Rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Crear carpetas de trabajo
        run: |
          mkdir -p COURIER_DAILY CONNECTIONS CANCELLATIONS_RTA datos_salida

      # 1. BAJAR EL BRONZE EXISTENTE (histórico). Si no existe, no falla.
      - name: Bajar bronce existente desde Drive
        run: |
          rclone copy "gdrive:" datos_salida/ \
            --drive-root-folder-id 1WMsH1E6CRLcT1BgZ0voDpt62yf6m0vy_ \
            --include "bronze_*.parquet" \
            --transfers 8 --checkers 8 -v || echo "Sin bronce previo (primera corrida)"

      # 2. BAJAR SOLO CSVs RECIENTES (paralelo + últimos 25 días)
      - name: Descargar COURIER_DAILY (reciente)
        run: |
          rclone copy "gdrive:" COURIER_DAILY/ \
            --drive-root-folder-id 1PNsRT6zCBmOFLqLqhvWqis68Ih0VpxyY \
            --transfers 32 --checkers 32 --fast-list --max-age 5d -v

      - name: Descargar CONNECTIONS (reciente)
        run: |
          rclone copy "gdrive:" CONNECTIONS/ \
            --drive-root-folder-id 14jpv8c2nLlJwXH_CcYE2YdBxPA3lQif1 \
            --transfers 32 --checkers 32 --fast-list --max-age 5d -v

      - name: Descargar CANCELLATIONS_RTA (reciente)
        run: |
          rclone copy "gdrive:" CANCELLATIONS_RTA/ \
            --drive-root-folder-id 1eT7lC1J86Zr3P7wX7S2Nm_IvE_wA-R2u \
            --transfers 32 --checkers 32 --fast-list --max-age 2d -v

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install polars pyarrow supabase
          

      # 3. EJECUTAR PIPELINE (bronce viejo + CSVs nuevos → actualiza)
      - name: Ejecutar pipeline
        run: python -u proceso_completo_uber.py

      # 4. SUBIR BRONZE ACTUALIZADO + el parquet de producción
      - name: Subir bronce actualizado a Drive
        run: |
          rclone copy datos_salida/ "gdrive:" \
            --drive-root-folder-id 1WMsH1E6CRLcT1BgZ0voDpt62yf6m0vy_ \
            --include "bronze_*.parquet" \
            --transfers 8 --checkers 8 -v

      - name: Subir resultado a Drive
        run: |
          rclone copy datos_salida/rides_silver.parquet "gdrive:" \
            --drive-root-folder-id 1WMsH1E6CRLcT1BgZ0voDpt62yf6m0vy_ -v
